<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f4d35e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Gridscape</title>
    <style>
      #gridscape-provider-button{position:fixed;right:14px;bottom:14px;z-index:2147483647;border:1px solid rgba(255,255,255,.2);border-radius:14px;background:#111;color:#fff;padding:10px 13px;font:600 13px system-ui;box-shadow:0 8px 30px rgba(0,0,0,.25)}
      #gridscape-provider-panel{display:none;position:fixed;right:14px;bottom:60px;z-index:2147483647;width:min(360px,calc(100vw - 28px));max-height:75vh;overflow:auto;padding:16px;border:1px solid rgba(255,255,255,.14);border-radius:18px;background:#101010;color:#fff;font:14px system-ui;box-shadow:0 16px 50px rgba(0,0,0,.4)}
      #gridscape-provider-panel.open{display:block}.gsp-title{font-size:16px;font-weight:700;margin-bottom:12px}.gsp-label{display:block;margin:10px 0 5px;color:#bbb;font-size:12px}.gsp-input,.gsp-select{box-sizing:border-box;width:100%;border:1px solid #333;border-radius:10px;background:#181818;color:#fff;padding:9px;outline:none}.gsp-row{display:flex;gap:8px;margin-top:12px}.gsp-btn{flex:1;border:0;border-radius:10px;padding:10px;font-weight:700}.gsp-save{background:#f4d35e;color:#111}.gsp-reset{background:#292929;color:#fff}.gsp-note{margin-top:10px;color:#999;font-size:11px;line-height:1.4}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <button id="gridscape-provider-button" type="button">Provider</button>
    <div id="gridscape-provider-panel">
      <div class="gsp-title">AI Provider Settings</div>
      <label class="gsp-label">Provider</label>
      <select id="gsp-provider" class="gsp-select">
        <option value="gemini">Gemini</option>
        <option value="openai">OpenAI-compatible</option>
        <option value="custom">Custom OpenAI-compatible</option>
      </select>
      <label class="gsp-label">API Key</label>
      <input id="gsp-key" class="gsp-input" type="password" placeholder="Enter API key" autocomplete="off" />
      <label class="gsp-label">Model</label>
      <input id="gsp-model" class="gsp-input" type="text" placeholder="e.g. gemini-3.1-flash-lite" />
      <label class="gsp-label">Base URL (OpenAI/custom)</label>
      <input id="gsp-base" class="gsp-input" type="url" placeholder="https://api.example.com/v1" />
      <div class="gsp-row"><button id="gsp-save" class="gsp-btn gsp-save">Save</button><button id="gsp-reset" class="gsp-btn gsp-reset">Reset</button></div>
      <div class="gsp-note">Settings are stored locally on this device. For production deployments, prefer server-side secrets instead of embedding keys in the APK.</div>
    </div>
    <script>
      (()=>{
        const KEY='gridscape-provider-settings-v1';
        const defaults={provider:'gemini',apiKey:'',model:'',baseUrl:''};
        const load=()=>{try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return defaults}};
        const save=s=>localStorage.setItem(KEY,JSON.stringify(s));
        const els={p:document.getElementById('gsp-provider'),k:document.getElementById('gsp-key'),m:document.getElementById('gsp-model'),b:document.getElementById('gsp-base'),panel:document.getElementById('gridscape-provider-panel')};
        const fill=()=>{const s=load();els.p.value=s.provider;els.k.value=s.apiKey;els.m.value=s.model;els.b.value=s.baseUrl};
        document.getElementById('gridscape-provider-button').onclick=()=>{els.panel.classList.toggle('open');fill()};
        document.getElementById('gsp-save').onclick=()=>{save({provider:els.p.value,apiKey:els.k.value.trim(),model:els.m.value.trim(),baseUrl:els.b.value.trim().replace(/\/$/,'')});els.panel.classList.remove('open')};
        document.getElementById('gsp-reset').onclick=()=>{save(defaults);fill()};fill();
        const originalFetch=window.fetch.bind(window);
        window.fetch=(input,init={})=>{
          try{
            const url=typeof input==='string'?input:input.url;
            if(url && url.includes('/api/')){
              const s=load();const h=new Headers(init.headers||{});
              if(s.provider)h.set('X-Gridscape-Provider',s.provider);
              if(s.apiKey)h.set('X-Gridscape-Api-Key',s.apiKey);
              if(s.model)h.set('X-Gridscape-Model',s.model);
              if(s.baseUrl)h.set('X-Gridscape-Base-URL',s.baseUrl);
              init={...init,headers:h};
            }
          }catch(e){}
          return originalFetch(input,init);
        };
        let pinch=null;
        const distance=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
        const target=()=>document.getElementById('root')?.firstElementChild||document.getElementById('root');
        document.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch={d:distance(e.touches[0],e.touches[1]),x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2}}},{passive:false});
        document.addEventListener('touchmove',e=>{if(e.touches.length!==2||!pinch)return;e.preventDefault();const d=distance(e.touches[0],e.touches[1]);const delta=Math.max(-.18,Math.min(.18,(d-pinch.d)/Math.max(80,pinch.d)*1.6));if(Math.abs(delta)>.002){target()?.dispatchEvent(new WheelEvent('wheel',{bubbles:true,cancelable:true,ctrlKey:true,deltaY:-delta*330,clientX:pinch.x,clientY:pinch.y}));pinch.d=d}},{passive:false});
        document.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null},{passive:true});
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
